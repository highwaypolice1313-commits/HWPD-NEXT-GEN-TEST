<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบรายงานประจำวัน</title>
<style>
  :root { --c:#1d5f8a; --bg:#eef3f8; --card:#fff; --line:#d7e0ea; --txt:#1c2b39; --warn:#ffd54a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Sarabun","Noto Sans Thai",system-ui,sans-serif; background:var(--bg); color:var(--txt); }
  .banner { background:var(--warn); text-align:center; padding:8px; font-weight:600; }
  header { display:flex; align-items:center; justify-content:space-between; background:var(--c); color:#fff; padding:12px 18px; }
  header .who { font-size:14px; opacity:.9; }
  nav { display:flex; flex-wrap:wrap; gap:6px; padding:10px 18px; background:#fff; border-bottom:1px solid var(--line); }
  nav a { padding:6px 10px; border-radius:6px; text-decoration:none; color:var(--c); font-size:14px; }
  nav a.on { background:var(--c); color:#fff; }
  main { max-width:920px; margin:20px auto; padding:0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
  h2 { margin:0 0 14px; font-size:20px; color:var(--c); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
  label { display:block; font-size:13px; color:#4a5b6b; margin-bottom:4px; }
  input, select, textarea { width:100%; padding:9px 10px; border:1px solid var(--line); border-radius:6px; font:inherit; background:#fff; }
  textarea { min-height:80px; }
  button { background:var(--c); color:#fff; border:0; border-radius:6px; padding:10px 16px; font:inherit; cursor:pointer; }
  button.ghost { background:#fff; color:var(--c); border:1px solid var(--c); }
  button.ok { background:#2e7d4f; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:#4a5b6b; font-weight:600; background:#f6f9fc; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; }
  .pending { background:#fff3cd; } .approved { background:#d4edda; }
  .err { color:#b00020; margin-top:10px; min-height:20px; }
  .row { display:flex; gap:10px; align-items:end; flex-wrap:wrap; margin-bottom:14px; }
  .row > div { flex:1; min-width:160px; }
  .center { max-width:360px; margin:60px auto; }
</style>
</head>
<body>

<div id="banner" class="banner" hidden>โหมดทดลอง: ข้อมูลทั้งหมดเป็นข้อมูลสมมติ ไม่กระทบข้อมูลจริง</div>
<header>
  <span><strong>ระบบรายงานประจำวัน</strong></span>
  <span class="who"><span id="who"></span> <button id="logout" class="ghost" hidden style="margin-left:8px;background:#fff">ออกจากระบบ</button></span>
</header>
<nav id="nav" hidden></nav>
<main id="app"></main>

<script>
// ===== ตั้งค่า =====
const API_URL = 'PASTE_APPS_SCRIPT_WEB_APP_URL_HERE';

// ===== นิยามโมดูล ต้องตรงกับ MODULES ใน Code.gs =====
const MODULES = {
  daily: { label:'รายงานประจำวัน', perm:'daily', fields:[
    {name:'report_time',label:'วันเวลาที่รายงาน',type:'datetime-local'},
    {name:'shift',label:'เวร',type:'select',options:['เวรผลัด','เวรสืบเวร']},
    {name:'type',label:'ประเภท',type:'select',options:['ว.43','ว.42','ว.20','บริการ']},
    {name:'count',label:'จำนวน',type:'number'},
    {name:'note',label:'หมายเหตุ',type:'textarea'}],
    cols:['report_time','shift','type','count'] },
  checkpoint: { label:'รายงานด่าน', perm:'checkpoint', fields:[
    {name:'checkpoint_name',label:'ชื่อด่าน',type:'text'},
    {name:'start_time',label:'เวลาเริ่ม',type:'datetime-local'},
    {name:'end_time',label:'เวลาสิ้นสุด',type:'datetime-local'},
    {name:'lat',label:'ละติจูด',type:'text'},
    {name:'lng',label:'ลองจิจูด',type:'text'},
    {name:'result',label:'ผลการตรวจ',type:'text'},
    {name:'note',label:'หมายเหตุ',type:'textarea'}],
    cols:['checkpoint_name','start_time','result'] },
  arrest: { label:'รายงานการจับกุม', perm:'arrest', fields:[
    {name:'arrest_time',label:'เวลาจับกุม',type:'datetime-local'},
    {name:'charge',label:'ข้อหา',type:'text'},
    {name:'suspect_name',label:'ชื่อผู้ต้องหา',type:'text'},
    {name:'place',label:'สถานที่',type:'text'},
    {name:'note',label:'หมายเหตุ',type:'textarea'}],
    cols:['arrest_time','charge','suspect_name','place'] },
  accident: { label:'รายงานอุบัติเหตุ', perm:'accident', fields:[
    {name:'accident_time',label:'วันเวลาเกิดเหตุ',type:'datetime-local'},
    {name:'road',label:'ทางหลวง',type:'text'},
    {name:'km',label:'กม.',type:'text'},
    {name:'direction',label:'ทิศทาง',type:'select',options:['ขาเข้า','ขาออก']},
    {name:'deaths',label:'เสียชีวิต (ราย)',type:'number'},
    {name:'injuries',label:'บาดเจ็บ (ราย)',type:'number'},
    {name:'summary',label:'สรุปเหตุ',type:'textarea'}],
    cols:['accident_time','road','km','deaths','injuries'] },
  task: { label:'แจ้งภารกิจ', perm:'task', fields:[
    {name:'start',label:'เริ่มภารกิจ',type:'datetime-local'},
    {name:'end',label:'สิ้นสุดภารกิจ',type:'datetime-local'},
    {name:'units',label:'หน่วยที่เกี่ยวข้อง',type:'text'},
    {name:'details',label:'รายละเอียด',type:'textarea'},
    {name:'place',label:'สถานที่',type:'text'}],
    cols:['start','end','units','place'] },
  fuel: { label:'น้ำมัน/น้ำมันเครื่อง', perm:'fuel', fields:[
    {name:'time',label:'วันเวลา',type:'datetime-local'},
    {name:'plate',label:'หมายเลขทะเบียนรถ',type:'text'},
    {name:'fuel_type',label:'ประเภทน้ำมัน',type:'select',options:['เบนซิน','ดีเซล','น้ำมันเครื่อง']},
    {name:'liters',label:'จำนวน (ลิตร)',type:'number'},
    {name:'price',label:'ราคา (บาท)',type:'number'},
    {name:'receipt_no',label:'เลขที่ใบเสร็จ',type:'text'}],
    cols:['time','plate','fuel_type','liters','price'] },
  news: { label:'ส่งข่าวประชาสัมพันธ์', perm:'news', fields:[
    {name:'news_time',label:'วันเวลาของข่าว',type:'datetime-local'},
    {name:'news_type',label:'ประเภทข่าว',type:'select',options:['อุบัติเหตุ','จับกุม','ประชาสัมพันธ์','อื่นๆ']},
    {name:'headline',label:'พาดหัวข่าว',type:'text'},
    {name:'body',label:'เนื้อหาข่าว',type:'textarea'}],
    cols:['news_time','news_type','headline'] },
  weight: { label:'ตรวจรถบรรทุกน้ำหนักเกิน', perm:'weight', fields:[
    {name:'check_time',label:'วันเวลาที่ตรวจ',type:'datetime-local'},
    {name:'inspector',label:'ผู้ตรวจ',type:'text'},
    {name:'plate',label:'ทะเบียน',type:'text'},
    {name:'max_weight',label:'น้ำหนักที่กฎหมายกำหนด (กก.)',type:'number'},
    {name:'actual_weight',label:'น้ำหนักที่ชั่งได้ (กก.)',type:'number'},
    {name:'result',label:'ผลการตรวจ',type:'text'}],
    cols:['check_time','plate','actual_weight','result'] },
  royal: { label:'รายงานรับเสด็จ', perm:'royal', fields:[
    {name:'mission',label:'ชื่อภารกิจ',type:'text'},
    {name:'time',label:'วันเวลา',type:'datetime-local'},
    {name:'place',label:'สถานที่',type:'text'},
    {name:'officers',label:'เจ้าหน้าที่ปฏิบัติ',type:'text'},
    {name:'note',label:'หมายเหตุ',type:'textarea'}],
    cols:['mission','time','place'] },
  other: { label:'รายงาน อื่นๆ', perm:'other', fields:[
    {name:'report_time',label:'วันเวลาที่รายงาน',type:'datetime-local'},
    {name:'activity',label:'การปฏิบัติ',type:'text'},
    {name:'details',label:'รายละเอียด',type:'textarea'},
    {name:'place',label:'สถานที่',type:'text'},
    {name:'note',label:'หมายเหตุ',type:'textarea'}],
    cols:['report_time','activity','place'] }
};

// ===== State และ helper =====
let session = JSON.parse(sessionStorage.getItem('session') || 'null');
let ENV = 'demo';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => v ? new Date(v).toLocaleString('th-TH') : '';
const perms = () => session ? session.user.perms : [];
const has = p => perms().includes('all') || perms().includes(p);

async function api(action, body = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token: session ? session.token : '', ...body })
  });
  const j = await res.json();
  ENV = j.env || ENV;
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

// ===== Render หลัก =====
function render() {
  $('#banner').hidden = ENV !== 'demo';
  if (!session) return renderLogin();
  $('#who').textContent = session.user.display_name + ' · ' + session.user.unit;
  $('#logout').hidden = false;
  $('#nav').hidden = false;
  buildNav();
  route();
}

function buildNav() {
  const items = [['#home','ภาพรวม', has('dashboard') || true]];
  Object.keys(MODULES).forEach(k => {
    if (has(MODULES[k].perm)) items.push(['#form/' + k, MODULES[k].label]);
  });
  $('#nav').innerHTML = items.map(([h, t]) =>
    `<a href="${h}" class="${location.hash === h || (h === '#home' && !location.hash) ? 'on' : ''}">${esc(t)}</a>`).join('');
}

function route() {
  const [a, b] = (location.hash || '#home').slice(1).split('/');
  if (a === 'list' && MODULES[b]) return renderList(b);
  if (a === 'form' && MODULES[b]) return renderForm(b);
  return renderHome();
}

window.addEventListener('hashchange', () => { if (session) { buildNav(); route(); } });

// ===== หน้าเข้าสู่ระบบ =====
function renderLogin() {
  $('#nav').hidden = true; $('#logout').hidden = true; $('#who').textContent = '';
  $('#app').innerHTML = `
    <div class="card center">
      <h2>เข้าสู่ระบบ</h2>
      <div class="row"><div><label>ชื่อผู้ใช้</label><input id="u" autocomplete="username"></div></div>
      <div class="row"><div><label>รหัสผ่าน</label><input id="p" type="password" autocomplete="current-password"></div></div>
      <button id="go" style="width:100%">เข้าสู่ระบบ</button>
      <div class="err" id="err"></div>
    </div>`;
  const submit = async () => {
    $('#err').textContent = '';
    try {
      const data = await api('login', { username: $('#u').value.trim(), password: $('#p').value });
      session = data;
      sessionStorage.setItem('session', JSON.stringify(session));
      location.hash = '#home';
      render();
    } catch (e) { $('#err').textContent = e.message; }
  };
  $('#go').onclick = submit;
  $('#p').onkeydown = e => { if (e.key === 'Enter') submit(); };
}

$('#logout').onclick = async () => {
  try { await api('logout'); } catch (e) {}
  session = null; sessionStorage.removeItem('session');
  location.hash = ''; render();
};

// ===== ภาพรวม =====
async function renderHome() {
  if (!has('dashboard')) {
    $('#app').innerHTML = `<div class="card"><h2>ยินดีต้อนรับ ${esc(session.user.display_name)}</h2>
      <p>เลือกเมนูด้านบนเพื่อบันทึกหรือดูรายการ</p></div>`;
    return;
  }
  const today = new Date().toISOString().slice(0, 10);
  const monthStart = today.slice(0, 8) + '01';
  $('#app').innerHTML = `
    <div class="card">
      <h2>ภาพรวม</h2>
      <div class="row">
        <div><label>จากวันที่</label><input type="date" id="from" value="${monthStart}"></div>
        <div><label>ถึงวันที่</label><input type="date" id="to" value="${today}"></div>
        <div style="flex:0"><button id="refresh">ดูผล</button></div>
      </div>
      <div id="sum"></div>
    </div>`;
  const load = async () => {
    const d = await api('summary', { from: $('#from').value, to: $('#to').value });
    $('#sum').innerHTML = `<table><tr><th>โมดูล</th><th>ทั้งหมด</th><th>รอตรวจ</th></tr>` +
      Object.keys(d).map(k => {
        const label = (Object.values(MODULES).find((m, i) => Object.keys(MODULES)[i] === k) || {}).label || k;
        const label2 = MODULES[k] ? MODULES[k].label : k;
        return `<tr><td>${esc(label2)}</td><td>${d[k].total}</td><td>${d[k].pending}</td></tr>`;
      }).join('') + `</table>`;
  };
  $('#refresh').onclick = () => load().catch(e => alert(e.message));
  load().catch(e => $('#sum').innerHTML = `<div class="err">${esc(e.message)}</div>`);
}

// ===== ฟอร์มบันทึก =====
function renderForm(mod) {
  const m = MODULES[mod];
  if (!has(m.perm)) return $('#app').innerHTML = '<div class="card">ไม่มีสิทธิ์ใช้งานส่วนนี้</div>';
  const inputs = m.fields.map(f => {
    let el;
    if (f.type === 'select') el = `<select name="${f.name}">${f.options.map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') el = `<textarea name="${f.name}"></textarea>`;
    else el = `<input name="${f.name}" type="${f.type}" ${f.type === 'number' ? 'step="any"' : ''}>`;
    return `<div><label>${esc(f.label)}</label>${el}</div>`;
  }).join('');
  $('#app').innerHTML = `
    <div class="card">
      <h2>${esc(m.label)}</h2>
      <p style="font-size:13px;color:#4a5b6b">หน่วย: ${esc(session.user.unit)}</p>
      <div class="grid">${inputs}</div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button id="save">ส่งรายงาน</button>
        <button class="ghost" onclick="location.hash='#list/${mod}'">ดูรายการ</button>
      </div>
      <div class="err" id="err"></div>
    </div>`;
  $('#save').onclick = async () => {
    $('#err').textContent = '';
    const payload = {};
    m.fields.forEach(f => {
      const el = document.querySelector(`[name="${f.name}"]`);
      payload[f.name] = el ? el.value : '';
    });
    try {
      await api('submit', { module: mod, payload });
      alert('บันทึกเรียบร้อย');
      location.hash = '#list/' + mod;
    } catch (e) { $('#err').textContent = e.message; }
  };
}

// ===== รายการ + อนุมัติ =====
function renderList(mod) {
  const m = MODULES[mod];
  if (!has(m.perm)) return $('#app').innerHTML = '<div class="card">ไม่มีสิทธิ์ใช้งานส่วนนี้</div>';
  const today = new Date().toISOString().slice(0, 10);
  $('#app').innerHTML = `
    <div class="card">
      <h2>${esc(m.label)} · รายการ</h2>
      <div class="row">
        <div><label>จากวันที่</label><input type="date" id="from" value="${today.slice(0,8)+'01'}"></div>
        <div><label>ถึงวันที่</label><input type="date" id="to" value="${today}"></div>
        <div style="flex:0"><button id="refresh">ค้นหา</button></div>
      </div>
      <div id="tbl"></div>
      <div class="err" id="err"></div>
    </div>`;
  const load = async () => {
    $('#err').textContent = '';
    const rows = await api('list', { module: mod, filter: { from: $('#from').value, to: $('#to').value } });
    if (!rows.length) { $('#tbl').innerHTML = '<p>ไม่มีรายการ</p>'; return; }
    const cols = m.cols;
    $('#tbl').innerHTML = `<table><tr>${cols.map(c => `<th>${esc(fieldLabel(mod, c))}</th>`).join('')}
      <th>หน่วย</th><th>สถานะ</th><th></th></tr>` +
      rows.map(r => `<tr>
        ${cols.map(c => `<td>${esc(c.includes('time') || c === 'start' || c === 'end' ? fmt(r[c]) : r[c])}</td>`).join('')}
        <td>${esc(r.unit)}</td>
        <td><span class="tag ${esc(r.status)}">${r.status === 'approved' ? 'อนุมัติแล้ว' : 'รอตรวจ'}</span></td>
        <td>${has('approve') && r.status === 'pending'
          ? `<button class="ok" data-id="${esc(r.id)}">อนุมัติ</button>` : ''}</td>
      </tr>`).join('') + '</table>';
    document.querySelectorAll('button[data-id]').forEach(btn => {
      btn.onclick = async () => {
        try { await api('approve', { module: mod, id: btn.dataset.id }); load(); }
        catch (e) { $('#err').textContent = e.message; }
      };
    });
  };
  $('#refresh').onclick = () => load().catch(e => $('#err').textContent = e.message);
  load().catch(e => $('#err').textContent = e.message);
}

function fieldLabel(mod, name) {
  const f = MODULES[mod].fields.find(x => x.name === name);
  return f ? f.label : name;
}

// ===== เริ่มต้น =====
(async () => {
  try {
    if (session) {
      try { session.user = await api('me'); sessionStorage.setItem('session', JSON.stringify(session)); }
      catch (e) { session = null; sessionStorage.removeItem('session'); }
    }
    render();
  } catch (e) {
    $('#app').innerHTML = `<div class="card err">เชื่อมต่อไม่ได้: ${esc(e.message)}</div>`;
  }
})();
</script>
</body>
</html>
