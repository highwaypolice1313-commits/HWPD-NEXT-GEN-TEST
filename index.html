<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบรายงานประจำวัน</title>

<!-- ฟอนต์ Sarabun + ไอคอน Font Awesome (โหลดจาก CDN) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
  /* ===== ตัวแปรสี (โหมดสว่าง) ===== */
  :root {
    --c: #1565a8; --c2: #2f86c9; --title: #0f7391;
    --txt: #16283a; --muted: #64748b; --line: #d3deea;
    --card: rgba(255,255,255,.82); --field: #ffffff;
    --warn-bg: #fff4e0; --warn-tx: #b45309; --warn-line: #f5d9a8;
    --ok: #2e9e6a;
    --bg1: #b7defa; --bg2: #eaf2fb; --bg3: #c9efec;
    --radius: 18px; --shadow: 0 8px 28px rgba(21,101,168,.10);
  }
  /* ===== ตัวแปรสี (โหมดมืด) ===== */
  [data-theme="dark"] {
    --c: #4aa3e8; --c2: #2f86c9; --title: #5fd0e8;
    --txt: #e6eef7; --muted: #93a4b8; --line: #2a3a4d;
    --card: rgba(22,34,48,.88); --field: #101c2a;
    --warn-bg: #3a2c12; --warn-tx: #fbbf24; --warn-line: #5a4519;
    --bg1: #0b1622; --bg2: #0f1e2e; --bg3: #0e2a2e;
    --shadow: 0 8px 28px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html { min-height: 100%; }
  body { margin: 0; min-height: 100vh; color: var(--txt);
    font-family: "Sarabun", "Noto Sans Thai", system-ui, sans-serif;
    background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%) fixed; }
  [hidden] { display: none !important; }

  .banner { background: #ffd166; text-align: center; padding: 7px 10px; font-weight: 600; font-size: 14px; color: #3b2f00; }

  main { max-width: 1080px; margin: 0 auto; padding: 26px 18px 120px; }
  main.narrow { max-width: 620px; }
  .card { background: var(--card); border: 1px solid rgba(255,255,255,.6); border-radius: var(--radius);
    padding: 22px; box-shadow: var(--shadow); backdrop-filter: blur(8px); }
  [data-theme="dark"] .card { border-color: var(--line); }

  /* ===== เข้าสู่ระบบ ===== */
  .login { max-width: 380px; margin: 70px auto; }
  .login h2 { margin: 0 0 16px; color: var(--title); font-size: 22px; text-align: center; }

  /* ===== หน้าหลัก ===== */
  .hero { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .hero small { color: var(--muted); font-size: 14px; }
  .hero h1 { margin: 2px 0 8px; font-size: 28px; line-height: 1.2; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; font-size: 13px;
    border: 1px solid var(--line); border-radius: 999px; background: var(--field); color: var(--muted); }
  .chip i { color: var(--c); font-size: 12px; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .sq { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; cursor: pointer;
    background: var(--field); border: 1px solid var(--line); color: var(--c); font-size: 16px; padding: 0; }
  .sq.sm { width: 36px; height: 36px; font-size: 14px; border-radius: 8px; flex: none; }
  .sq.red { color: #d92d20; }
  .pill-btn { height: 44px; padding: 0 14px; border-radius: 12px; background: var(--field); border: 1px solid var(--line);
    color: #c2570c; cursor: pointer; font: inherit; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
  .sec { display: flex; align-items: center; gap: 8px; margin: 26px 4px 10px; font-weight: 600; font-size: 16px; }
  .sec i { color: var(--c); }
  .todo { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
  .todo .ico { width: 56px; height: 56px; border-radius: 14px; display: grid; place-items: center; font-size: 22px;
    background: #d9f1e7; color: #1f8f62; border: 1px solid #bfe6d3; }
  .todo.warn .ico { background: #fff1d6; color: #c2570c; border-color: #fbd9a0; }
  .todo b { display: block; font-size: 17px; }
  .todo span { font-size: 13px; color: var(--muted); }
  .quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
  .qcard { cursor: pointer; padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid rgba(255,255,255,.6);
    box-shadow: var(--shadow); transition: transform .15s; text-decoration: none; color: inherit; display: block; }
  .qcard:hover { transform: translateY(-2px); }
  .qcard b { display: block; margin-top: 14px; font-size: 17px; }
  .qcard span { font-size: 12.5px; color: var(--muted); }
  .ibox { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; border: 1px solid transparent; }
  .ibox.sm { width: 36px; height: 36px; font-size: 15px; border-radius: 10px; flex: none; }
  .t-blue   { background: #dbeefb; color: #1565a8; border-color: #bcdcf3; }
  .t-orange { background: #fde8d6; color: #c2570c; border-color: #f7cfae; }
  .t-red    { background: #fde0e0; color: #d92d20; border-color: #f6bcbc; }
  .t-purple { background: #ece0fb; color: #7e3fd0; border-color: #d9c4f3; }
  .t-green  { background: #d9f1e7; color: #1f8f62; border-color: #bfe6d3; }
  .t-brown  { background: #f6e9d6; color: #a9690b; border-color: #ead2ad; }
  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; align-items: start; }
  .group h4 { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--muted); display: flex; gap: 7px; align-items: center; }
  .item { display: flex; align-items: center; gap: 12px; padding: 9px 12px; margin-bottom: 8px; border-radius: 12px;
    background: var(--field); border: 1px solid var(--line); cursor: pointer; text-decoration: none; color: inherit; }
  .item:hover { border-color: var(--c2); }
  .item span { flex: 1; font-size: 15px; }
  .item .chev { color: var(--muted); font-size: 12px; }

  /* ===== แถบบน + แท็บ ===== */
  .topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 12px; }
  .topbar h2 { margin: 0; font-size: 18px; color: var(--title); text-align: center; }
  .back { justify-self: start; display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; font-size: 12px; cursor: pointer;
    background: var(--field); color: var(--c); border: 1px solid var(--c2); border-radius: 6px; font-family: inherit; }
  .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .tabs button { background: transparent; color: var(--muted); border: 0; font-size: 13px; padding: 6px 12px; border-radius: 8px; font-family: inherit; cursor: pointer; }
  .tabs button.on { background: #cfe5f7; color: var(--c); font-weight: 600; }
  [data-theme="dark"] .tabs button.on { background: #1d3a56; }

  /* ===== ฟอร์ม ===== */
  .form-title { text-align: center; color: var(--title); font-size: 16px; font-weight: 600; margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 14px; }
  .grid .full { grid-column: 1 / -1; }
  .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 14px; }
  .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 14px; }
  .stack { display: grid; gap: 8px; align-content: start; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    font: inherit; font-size: 14px; background: var(--field); color: var(--txt); }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--c2); box-shadow: 0 0 0 3px rgba(47,134,201,.18); }
  input[type=number] { text-align: center; }
  input[readonly] { background: #fdf0d8; border-color: #e9a24a; color: #8a4b08; font-weight: 600; }
  textarea { min-height: 84px; resize: vertical; }
  .divider { grid-column: 1 / -1; border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
  .with-btn { display: flex; gap: 8px; }
  .with-btn input { flex: 1; }
  .note-s { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* กล่องย่อย / ป้าย / แถวไดนามิก */
  .subbox { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--field); }
  .subbox.beige { background: #fff8e6; border: 1px dashed #f0c96a; }
  [data-theme="dark"] .subbox.beige { background: #2a2312; }
  .sb-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; font-size: 13px; }
  .sb-sub { font-size: 12px; color: var(--muted); margin: 2px 0; }
  .sb-sub.sum { color: #c2570c; font-weight: 600; }
  .sb-sub.bad { color: #d92d20; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; }
  .badge.cyan { background: #19c4e6; color: #fff; }
  .badge.yellow { background: #ffc107; color: #3b2f00; }
  .mini { padding: 4px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; font-family: inherit;
    background: var(--field); color: var(--c); border: 1px solid var(--c2); display: inline-flex; gap: 6px; align-items: center; }
  .mini.yellow { background: #ffc107; color: #3b2f00; border-color: #ffc107; font-weight: 600; }
  .mini.warn { background: transparent; color: #c2570c; border-color: #e9a24a; }
  .mini.on { background: var(--c); color: #fff; }
  .rowx { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .rowx > input, .rowx > select { flex: 1; min-width: 0; }
  .rowx > input[type=number] { flex: 0 0 84px; }
  .grp { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--c); display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
  .grp span { color: var(--muted); font-weight: 500; }
  .tog { width: 100%; text-align: center; padding: 7px 10px; font-size: 12.5px; cursor: pointer; font-family: inherit;
    background: var(--field); color: var(--c); border: 1px solid var(--c2); border-radius: 6px; }
  .panel { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--field); }
  .hint { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--warn-bg); color: var(--warn-tx);
    border: 1px solid var(--warn-line); border-radius: 8px; padding: 8px 12px; font-size: 12.5px; }
  .hint .grow { flex: 1; min-width: 200px; }

  /* ===== ปุ่มหลัก ===== */
  button { font: inherit; cursor: pointer; }
  .btn { width: 100%; background: linear-gradient(180deg, var(--c2), var(--c)); color: #fff; border: 0; border-radius: 8px;
    padding: 11px 18px; font-weight: 600; box-shadow: 0 4px 12px rgba(21,101,168,.25); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.ghost { background: var(--field); color: var(--c); border: 1px solid var(--c2); box-shadow: none; }
  .btn.ok { width: auto; background: linear-gradient(180deg, #4cc38a, var(--ok)); padding: 6px 12px; font-size: 13px; }
  .actions { margin-top: 18px; display: grid; gap: 10px; }

  /* ===== ตาราง ===== */
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; }
  .pending { background: #fff3cd; color: #7a5a00; }
  .approved { background: #d4f3e3; color: #14663e; }
  .stat-num { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--c); }
  .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; margin-bottom: 14px; }
  .row > div { flex: 1; min-width: 150px; }
  .err { color: #b00020; margin-top: 10px; min-height: 18px; font-size: 14px; }

  /* ===== ปุ่มลอย ===== */
  .fab { position: fixed; right: 18px; bottom: 18px; z-index: 20; display: inline-flex; gap: 9px; align-items: center;
    padding: 12px 20px; border-radius: 999px; border: 0; color: #fff; font-weight: 600;
    background: linear-gradient(180deg, #1f6fb5, #14558f); box-shadow: 0 8px 22px rgba(20,85,143,.4); }

  /* ===== Modal แจ้งเตือน ===== */
  .overlay { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px;
    background: rgba(10,25,40,.5); backdrop-filter: blur(3px); animation: fade .15s ease both; }
  .modal { width: min(440px, 100%); max-height: 88vh; overflow: auto; background: var(--field); color: var(--txt);
    border-radius: 18px; padding: 24px 22px 18px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); animation: pop .18s ease both; }
  .m-ico { width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; }
  .m-ico.info { background: #dbeefb; color: #1565a8; }
  .m-ico.ok { background: #d9f1e7; color: #1f8f62; }
  .m-ico.err { background: #fde0e0; color: #d92d20; }
  .m-ico.warn { background: #fff1d6; color: #c2570c; }
  .modal h3 { margin: 0 0 8px; font-size: 18px; }
  .m-body { font-size: 14px; color: var(--muted); text-align: left; }
  .m-body p { margin: 0; text-align: center; line-height: 1.6; }
  .m-body ul { margin: 0; padding-left: 20px; line-height: 1.7; color: var(--txt); }
  .m-act { display: flex; gap: 10px; margin-top: 18px; }
  .sum { display: grid; gap: 6px; }
  .sum div { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .sum span { color: var(--muted); }
  .sum b { color: var(--txt); text-align: right; font-weight: 600; word-break: break-word; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }

  @media (max-width: 600px) {
    .grid { grid-template-columns: 1fr; }
    .g4 { grid-template-columns: repeat(2, 1fr); }
    .g3 { grid-template-columns: 1fr; }
    .hero h1 { font-size: 23px; }
    main { padding: 16px 12px 110px; }
    .rowx { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<div id="banner" class="banner" hidden>โหมดทดลอง: ข้อมูลทั้งหมดเป็นข้อมูลสมมติ ไม่กระทบข้อมูลจริง</div>
<main id="app"></main>
<button id="fab" class="fab" hidden><i class="fa-solid fa-scale-balanced"></i> ผู้ช่วยกฎหมาย</button>

<script>
/* ============================================================
   ตั้งค่าหลัก
   ============================================================ */
// 🔧 PLACEHOLDER: URL เว็บแอป Apps Script (ค่าเดิมคงไว้ได้ถ้าไม่เปลี่ยน)
const API_URL = 'https://script.google.com/macros/s/AKfycbxssyQml6dXj92np0pSwDfFNEGtDqu4O3kAUxueMViNDk-yhJHb0UCf6Lj9mwKofM8sYA/exec';

/* ============================================================
   นิยามโมดูล (daily ใช้ฟอร์มพิเศษ renderDailyForm ด้านล่าง)
   ============================================================ */
const MODULES = {
  daily: { label: 'รายงานประจำวัน', desc: 'ยอดผลการปฏิบัติประจำผลัด', icon: 'fa-clipboard-list', tone: 't-blue', perm: 'daily',
    title: 'หมวดรายงานประจำวัน HWPD', fields: [],
    // ชื่อคอลัมน์ในหน้ารายการ
    labels: { type: 'ประเภท', report_time: 'วันที่เวลา', service_unit: 'หน่วยบริการ', radio_car: 'รถวิทยุ' },
    cols: ['type', 'report_time', 'service_unit', 'radio_car'] },
  checkpoint: { label: 'รายงานตั้งด่าน', desc: 'จุดตรวจ ผลการตรวจ', icon: 'fa-road-barrier', tone: 't-orange', perm: 'checkpoint',
    title: 'รายงานด่าน จุดตรวจ จุดสกัด', fields: [
      { name: 'checkpoint_name', label: 'ชื่อด่าน', type: 'text', full: true },
      { name: 'start_time', label: 'เริ่มตั้งด่าน', type: 'datetime-local' },
      { name: 'end_time', label: 'เลิกด่าน', type: 'datetime-local' },
      { name: 'lat', label: 'ละติจูด', type: 'text', ph: 'เช่น 16.8765' },
      { name: 'lng', label: 'ลองจิจูด', type: 'text', ph: 'เช่น 98.5432' },
      { name: 'result', label: 'ผลการตรวจ', type: 'text', full: true },
      { name: 'note', label: 'หมายเหตุ', type: 'textarea', full: true }],
    cols: ['checkpoint_name', 'start_time', 'result'] },
  arrest: { label: 'รายงานจับกุม', desc: 'ผู้ต้องหา ข้อหา ของกลาง', icon: 'fa-handcuffs', tone: 't-red', perm: 'arrest',
    title: 'รายงานการจับกุม', fields: [
      { name: 'arrest_time', label: 'เวลาจับกุม', type: 'datetime-local' },
      { name: 'charge', label: 'ข้อหา', type: 'text' },
      { name: 'suspect_name', label: 'ชื่อผู้ต้องหา', type: 'text', ph: 'ชื่อ-สกุล' },
      { name: 'place', label: 'สถานที่', type: 'text' },
      { name: 'note', label: 'หมายเหตุ', type: 'textarea', full: true }],
    cols: ['arrest_time', 'charge', 'suspect_name', 'place'] },
  accident: { label: 'รายงานอุบัติเหตุ', desc: 'เหตุบนทางหลวง', icon: 'fa-car-burst', tone: 't-purple', perm: 'accident',
    title: 'รายงานอุบัติเหตุ', fields: [
      { name: 'accident_time', label: 'วันที่เวลาที่เกิดเหตุ', type: 'datetime-local' },
      { name: 'road', label: 'ทล.', type: 'text', ph: 'เช่น 1' },
      { name: 'km', label: 'กม.', type: 'text', ph: 'เช่น 580+400' },
      { name: 'direction', label: 'ทิศทาง', type: 'select', options: ['ขาเข้า', 'ขาออก'] },
      { name: 'deaths', label: 'เสียชีวิต (ราย)', type: 'number', ph: 'ระบุจำนวน หรือใส่ 0' },
      { name: 'injuries', label: 'ได้รับบาดเจ็บ (ราย)', type: 'number', ph: 'ระบุจำนวน หรือใส่ 0' },
      { name: 'summary', label: 'สรุปเหตุ', type: 'textarea', full: true }],
    cols: ['accident_time', 'road', 'km', 'deaths', 'injuries'] },
  task: { label: 'แจ้งภารกิจ', icon: 'fa-bullseye', tone: 't-red', perm: 'task', group: 'mission',
    title: 'แจ้งภารกิจ', fields: [
      { name: 'start', label: 'เริ่มภารกิจ', type: 'datetime-local' },
      { name: 'end', label: 'สิ้นสุดภารกิจ', type: 'datetime-local' },
      { name: 'units', label: 'หน่วยที่เกี่ยวข้อง', type: 'text' },
      { name: 'place', label: 'สถานที่', type: 'text' },
      { name: 'details', label: 'รายละเอียด', type: 'textarea', full: true }],
    cols: ['start', 'end', 'units', 'place'] },
  royal: { label: 'รายงานรับเสด็จ', icon: 'fa-shield-halved', tone: 't-brown', perm: 'royal', group: 'mission',
    title: 'รายงานรับเสด็จ', fields: [
      { name: 'mission', label: 'ชื่อภารกิจ', type: 'text', full: true },
      { name: 'time', label: 'วันเวลา', type: 'datetime-local' },
      { name: 'place', label: 'สถานที่', type: 'text' },
      { name: 'officers', label: 'เจ้าหน้าที่ปฏิบัติ', type: 'text', full: true },
      { name: 'note', label: 'หมายเหตุ', type: 'textarea', full: true }],
    cols: ['mission', 'time', 'place'] },

// ที่เก็บข้อมูลชั่วคราว (draft) — ถ้าเบราว์เซอร์บล็อก localStorage จะใช้หน่วยความจำแทน
const MEM = {};
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return MEM[k] || null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { MEM[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete MEM[k]; } }
};

async function api(action, body = {}) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, token: session ? session.token : '', ...body })
  });
  const j = await res.json();
  ENV = j.env || ENV;
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

function modal({ icon = 'fa-circle-info', tone = 'info', title = '', body = '', ok = 'ตกลง', cancel = null }) {
  return new Promise(resolve => {
    const ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">
      <div class="m-ico ${tone}"><i class="fa-solid ${icon}"></i></div>
      <h3>${esc(title)}</h3><div class="m-body">${body}</div>
      <div class="m-act">${cancel ? `<button class="btn ghost" data-r="0">${esc(cancel)}</button>` : ''}
        <button class="btn" data-r="1">${esc(ok)}</button></div></div>`;
    const onKey = e => { if (e.key === 'Escape') close(false); };
    const close = v => { ov.remove(); document.removeEventListener('keydown', onKey); resolve(v); };
    ov.addEventListener('click', e => {
      if (e.target === ov) return close(false);
      const b = e.target.closest('[data-r]');
      if (b) close(b.dataset.r === '1');
    });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(ov);
    ov.querySelector('[data-r="1"]').focus();
  });
}

  try {

      el.innerHTML = `<div class="ico"><i class="fa-solid fa-bell"></i></div>
        <div><b>มีรายงานรอตรวจ ${pending} รายการ</b><span>เปิดแผงควบคุมสถานีเพื่อตรวจสอบ</span></div>`;

function renderForm(mod, tabIdx = 0) {
  if (mod === 'daily') return renderDailyForm(0);
  const m = MODULES[mod];
  if (!has(m.perm)) { $('#app').innerHTML = '<div class="card">ไม่มีสิทธิ์ใช้งานส่วนนี้</div>'; return; }
  const inputs = m.fields.map(f => {
    let el;
    if (f.type === 'select') el = `<select name="${f.name}">${f.options.map(o => `<option>${esc(o)}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') el = `<textarea name="${f.name}" placeholder="${esc(f.ph || '')}"></textarea>`;
    else el = `<input name="${f.name}" type="${f.type}" value="${f.type === 'datetime-local' ? nowLocal() : ''}" placeholder="${esc(f.ph || '')}" ${f.type === 'number' ? 'step="any"' : ''}>`;
    return `<div class="${f.full ? 'full' : ''}"><label>${esc(f.label)}</label>${el}</div>`;
  }).join('');

  $('#app').innerHTML = `${topbar(m.title || m.label)}
    <div class="card">
      <p class="form-title">${esc(m.label)}</p>
      <div class="grid">${inputs}</div>
      <div class="actions">
        <button class="btn" id="save"><i class="fa-solid fa-paper-plane"></i> ตรวจสอบข้อมูลก่อนส่ง</button>
        <button class="btn ghost" id="toList">ดูรายการ</button>
      </div>
      <div class="err" id="err"></div>
    </div>`;
  bindBack();
  $('#toList').onclick = () => { location.hash = '#list/' + mod; };

  $('#save').onclick = async () => {
    $('#err').textContent = '';
    const payload = {};
    m.fields.forEach(f => { const el = document.querySelector(`[name="${f.name}"]`); payload[f.name] = el ? el.value : ''; });
    const rows = Object.entries(payload).filter(([, v]) => v !== '')
      .map(([k, v]) => [(m.fields.find(f => f.name === k) || {}).label || k, v]);
    if (!(await ask('ตรวจสอบข้อมูลก่อนส่ง', rows.length ? sumHtml(rows) : '<p>(ไม่มีข้อมูล)</p>'))) return;
    const btn = $('#save'); btn.disabled = true;
    try {
      await api('submit', { module: mod, payload });
      await notify('บันทึกเรียบร้อย', 'ส่งรายงานเข้าระบบแล้ว', 'ok');
      location.hash = '#list/' + mod;
    } catch (e) { $('#err').textContent = e.message; btn.disabled = false; }
  };
}

/* ---------- วาดหน้าฟอร์มรายงานประจำวัน ---------- */
function renderDailyForm(tab = 0) {
  if (!has('daily')) { $('#app').innerHTML = '<div class="card">ไม่มีสิทธิ์ใช้งานส่วนนี้</div>'; return; }
  flushSave();
  D.tab = tab; D.co = [{ name: '', role: '' }]; D.charges = []; D.grouped = false; D.open = {};
  $('#app').className = 'narrow';
  $('#app').innerHTML = `${topbar('หมวดรายงานประจำวัน HWPD')}
    <div class="tabs">${DAILY_TABS.map((t, i) => `<button class="${i === tab ? 'on' : ''}" data-tab="${i}"><i class="fa-solid ${t.icon}"></i> ${i + 1}. ${esc(t.name)}</button>`).join('')}</div>
    <div class="card" id="dform">
      <datalist id="dl-officers">${OPT.officers.map(o => `<option value="${esc(o.name)}">`).join('')}</datalist>
      <p class="form-title">${esc(DAILY_TABS[tab].title)}</p>
      <div class="grid">${dailyBody(tab)}</div>
      <div class="actions">
        <button class="btn" id="save"><i class="fa-solid fa-paper-plane"></i> ตรวจสอบข้อมูลก่อนส่ง</button>
      </div>
      <div class="err" id="err"></div>
    </div>`;
  bindBack();
  document.querySelectorAll('[data-tab]').forEach(b => { b.onclick = () => renderDailyForm(+b.dataset.tab); });

  // ค่าเริ่มต้น
  const set = (n, v) => { const el = document.querySelector(`#dform [name="${n}"]`); if (el) el.value = v; };
  set('report_time', nowLocal()); set('duty_from', today()); set('duty_to', today());
  if (session.user.unit && OPT.units.includes(session.user.unit)) set('service_unit', session.user.unit);

  // กู้ draft (ถ้ามี)
  const d = loadDraft(tab);
  if (d) {
    Object.entries(d.v || {}).forEach(([n, v]) => set(n, v));
    D.co = d.co && d.co.length ? d.co : D.co; D.charges = d.charges || []; D.grouped = !!d.grouped; D.open = d.open || {};
    const b = $('#draftBanner');
    if (b) b.hidden = false; else $('#dform .grid').insertAdjacentHTML('afterbegin', '<div class="hint" id="draftBanner"></div>');
    $('#draftBanner').hidden = false;
    $('#draftBanner').innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i>
      <span class="grow">กู้ข้อมูลที่กรอกค้างไว้กลับมาให้แล้ว ตรวจสอบความถูกต้องก่อนส่ง <b>ไฟล์ที่เคยแนบไว้ไม่ได้ถูกกู้กลับมาด้วย กรุณาแนบใหม่</b></span>
      <button type="button" class="mini warn" id="clearDraft">ล้างแล้วเริ่มใหม่</button>`;
  }
  drawCo(); drawCharges(); applyOpen(); syncTotals();

  const f = $('#dform');
  f.addEventListener('input', onDInput);
  f.addEventListener('change', onDChange);
  f.addEventListener('click', onDClick);
  $('#save').onclick = submitDaily;
}

/* ---------- รายชื่อผู้ร่วมปฏิบัติ ---------- */
function drawCo() {
  const box = $('#coList'); if (!box) return;
  const role = D.tab === 0;
  box.innerHTML = D.co.map((c, i) => `<div class="rowx" data-ci="${i}">
    <input data-ck="name" list="dl-officers" value="${esc(c.name)}" placeholder="พิมพ์ค้นหา หรือกดเลือกจากรายการ" autocomplete="off">
    ${role ? `<input data-ck="role" value="${esc(c.role)}" placeholder="ตำแหน่ง/บทบาท เช่น พลขับสำรอง">` : ''}
    ${D.co.length > 1 ? `<button type="button" class="sq sm red" data-cdel="${i}" title="ลบ"><i class="fa-solid fa-trash"></i></button>` : ''}</div>`).join('');
}

/* ---------- รายการข้อหา ว.20 ---------- */
function drawCharges() {
  const box = $('#chList'); if (!box) return;
  const all = [].concat(...Object.values(OPT.acts));
  const acts = Object.keys(OPT.acts);
  let rows = D.charges.map((c, i) => ({ c, i }));
  if (D.grouped) rows.sort((a, b) => (a.c.act || '\uffff').localeCompare(b.c.act || '\uffff', 'th'));
  let html = '', last = null;
  rows.forEach(({ c, i }) => {
    if (D.grouped && c.act !== last) {
      last = c.act;
      const sub = D.charges.filter(x => x.act === c.act).reduce((s, x) => s + (+x.n || 0), 0);
      html += `<div class="grp">${esc(c.act || 'ไม่ระบุ พ.ร.บ.')}<span>รวม ${sub} ครั้ง</span></div>`;
    }
    const opts = OPT.acts[c.act] || all;
    html += `<div class="rowx" data-i="${i}">
      <select data-k="act"><option value="">-- พ.ร.บ. --</option>${acts.map(a => `<option ${a === c.act ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select>
      <input data-k="charge" list="dl-ch-${i}" value="${esc(c.charge)}" placeholder="ข้อหา" autocomplete="off">
      <datalist id="dl-ch-${i}">${opts.map(o => `<option value="${esc(o)}">`).join('')}</datalist>
      <input data-k="n" type="number" min="0" step="1" value="${c.n}" title="จำนวนครั้ง">
      <button type="button" class="sq sm red" data-del="${i}" title="ลบ"><i class="fa-solid fa-trash"></i></button></div>`;
  });
  box.innerHTML = html;
  const g = $('#grpBtn'); if (g) g.classList.toggle('on', D.grouped);
  syncTotals();
}

// ยอด ว.20 อัตโนมัติ + ตรวจยอดแยกประเภทจับกุม
function syncTotals() {
  const w = document.querySelector('#dform [name="cnt_w20"]'); if (!w) return;
  const tot = D.charges.reduce((s, c) => s + (+c.n || 0), 0);
  w.value = tot; $('#ch20').textContent = tot;
  const v = n => +(document.querySelector(`#dform [name="${n}"]`) || {}).value || 0;
  const a = v('arrest_warrant') + v('arrest_flagrante');
  const el = $('#arrSum'); el.textContent = `รวมแยกประเภท ${a} / ยอด ว.20 ทั้งหมด ${tot}`;
  el.classList.toggle('bad', a > tot);
}

function applyOpen() {
  ['pol', 'srch'].forEach(k => { const p = $('#p-' + k); if (p) p.hidden = !D.open[k]; });
}

/* ---------- เหตุการณ์ในฟอร์ม ---------- */
function onDInput(e) {
  const t = e.target;
  if (t.dataset.ck !== undefined) D.co[+t.closest('[data-ci]').dataset.ci][t.dataset.ck] = t.value;
  else if (t.dataset.k !== undefined) {
    const c = D.charges[+t.closest('[data-i]').dataset.i];
    c[t.dataset.k] = t.dataset.k === 'n' ? (+t.value || 0) : t.value;
  }
  syncTotals(); queueSave();
}
function onDChange(e) {
  const t = e.target;
  if (t.dataset.k === 'act') { D.charges[+t.closest('[data-i]').dataset.i].act = t.value; drawCharges(); }
  else if (t.dataset.k === 'n' && D.grouped) drawCharges();
  // เลือกชื่อเจ้าหน้าที่แล้วเติมเบอร์โทรให้อัตโนมัติ (ถ้าช่องเบอร์ยังว่าง)
  if (t.matches('[data-officer]')) {
    const o = OPT.officers.find(x => x.name === t.value);
    const ph = document.querySelector(`#dform [name="${t.name}_phone"]`);
    if (o && o.phone && ph && !ph.value) ph.value = o.phone;
  }
  queueSave();
}
function onDClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.now !== undefined) { document.querySelector('#dform [name="report_time"]').value = nowLocal(); }
  else if (b.dataset.del !== undefined) { D.charges.splice(+b.dataset.del, 1); drawCharges(); }
  else if (b.dataset.cdel !== undefined) { D.co.splice(+b.dataset.cdel, 1); if (!D.co.length) D.co.push({ name: '', role: '' }); drawCo(); }
  else if (b.id === 'addCo') { D.co.push({ name: '', role: '' }); drawCo(); }
  else if (b.id === 'addCh') { D.charges.push({ act: '', charge: '', n: 1 }); drawCharges(); }
  else if (b.id === 'grpBtn') { D.grouped = !D.grouped; drawCharges(); }
  else if (b.dataset.tog) { D.open[b.dataset.tog] = !D.open[b.dataset.tog]; applyOpen(); }
  else if (b.id === 'clearDraft') { store.del(dkey(D.tab)); renderDailyForm(D.tab); return; }
  else return;
  queueSave();
}

/* ---------- Draft: บันทึกข้อมูลที่กรอกค้างไว้อัตโนมัติ ---------- */
const dkey = t => `hwpd_draft_${session.user.display_name}_${t}`;
function collectDaily() {
  const v = {};
  document.querySelectorAll('#dform [name]').forEach(el => { if (el.type !== 'file') v[el.name] = el.value; });
  return v;
}
function saveDraft() {
  if (!$('#dform')) return;
  store.set(dkey(D.tab), JSON.stringify({ v: collectDaily(), co: D.co, charges: D.charges, grouped: D.grouped, open: D.open, t: Date.now() }));
}
function queueSave() { clearTimeout(D.timer); D.timer = setTimeout(() => { D.timer = null; saveDraft(); }, 300); }
function flushSave() { if (D.timer) { clearTimeout(D.timer); D.timer = null; saveDraft(); } }
function loadDraft(t) {
  try {
    const d = JSON.parse(store.get(dkey(t)) || 'null');
    if (!d) return null;
    if (Date.now() - d.t > 12 * 3600 * 1000) { store.del(dkey(t)); return null; }   // draft เก่าเกิน 12 ชม. ทิ้ง
    return d;
  } catch (e) { return null; }
}

/* ---------- ไฟล์แนบ: ย่อรูปก่อนส่ง ---------- */
const toB64 = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้')); r.readAsDataURL(f); });
function compressImg(f) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const s = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res({ name: f.name.replace(/\.\w+$/, '') + '.jpg', mime: 'image/jpeg', data: c.toDataURL('image/jpeg', .8).split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('อ่านรูป ' + f.name + ' ไม่ได้')); };
    img.src = url;
  });
}
async function readFiles(list) {
  const out = []; let total = 0;
  for (const f of list) {
    let o;
    if (f.type.startsWith('image/')) o = await compressImg(f);
    else if (f.type === 'application/pdf') {
      if (f.size > 5 * 1024 * 1024) throw new Error(`ไฟล์ ${f.name} ใหญ่เกิน 5 MB`);
      o = { name: f.name, mime: f.type, data: await toB64(f) };
    } else throw new Error(`ไม่รองรับไฟล์ ${f.name} (รองรับรูปภาพและ PDF)`);
    total += o.data.length; out.push(o);
  }
  if (total > 20e6) throw new Error('ไฟล์แนบรวมใหญ่เกินไป กรุณาลดจำนวนไฟล์');
  return out;
}

/* ---------- ตรวจข้อมูล + ส่ง ---------- */
async function submitDaily() {
  $('#err').textContent = '';
  flushSave();
  const t = D.tab, v = collectDaily();
  const n = k => +v[k] || 0;
  const errs = [];
  if (t !== 2 && !v.service_unit) errs.push('กรุณาเลือกหน่วยบริการ');
  if (!v.report_time) errs.push('กรุณาระบุวันที่เวลาที่รายงาน');
  if ((t === 0 || t === 2) && v.duty_from && v.duty_to && v.duty_from > v.duty_to) errs.push('วันที่ "ถึงวันที่" ต้องไม่ก่อนวันที่เริ่มปฏิบัติหน้าที่');
  if ((t === 0 || t === 1) && n('bw_ready') + n('bw_broken') > n('bw_total')) errs.push('กล้อง Bodyworn: พร้อมใช้ + เสีย ต้องไม่เกินจำนวนทั้งหมด');
  if (t === 1) {
    if (n('arrest_warrant') + n('arrest_flagrante') > n('cnt_w20')) errs.push('ยอดแยกประเภทการจับกุมเกินยอด ว.20 ทั้งหมด');
    if (D.charges.some(c => (+c.n || 0) > 0 && !c.charge.trim())) errs.push('มีรายการข้อหาที่ระบุจำนวนแล้วแต่ยังไม่ได้ใส่ชื่อข้อหา');
  }
  if (errs.length) return listModal('ตรวจสอบข้อมูลอีกครั้ง', errs);

  // สร้าง payload (ฟิลด์ตัวเลขแปลงเป็นตัวเลข)
  const payload = { type: DAILY_TABS[t].name };
  Object.entries(v).forEach(([k, val]) => {
    const el = document.querySelector(`#dform [name="${k}"]`);
    payload[k] = el && el.type === 'number' ? (val === '' ? 0 : +val) : val;
  });
  const co = D.co.filter(c => c.name.trim());
  if (t === 0 || t === 3) payload.co_officers = JSON.stringify(co);
  if (t === 1) payload.charges = JSON.stringify(D.charges.filter(c => c.charge.trim() && (+c.n || 0) > 0));

  // สรุปให้ตรวจก่อนส่ง
  const rows = [['ประเภท', payload.type]];
  Object.keys(DL).forEach(k => {
    const val = payload[k];
    if (val === undefined || val === '' || val === 0) return;
    rows.push([DL[k], k === 'report_time' ? fmt(val) : (k === 'duty_from' || k === 'duty_to') ? fmtDate(val) : val]);
  });
  if (co.length) rows.push([t === 0 ? 'ผู้ร่วมออก ว.4' : 'เจ้าหน้าที่ผู้ปฏิบัติ', co.map(c => c.name + (c.role ? ` (${c.role})` : '')).join(', ')]);
  if (t === 1 && D.charges.length) rows.push(['รายการข้อหา', D.charges.filter(c => c.charge.trim() && +c.n > 0).map(c => `${c.charge} ×${c.n}`).join(', ')]);
  const fl = document.querySelector('#dform [name="__files"]').files;
  if (fl.length) rows.push(['ไฟล์แนบ', fl.length + ' ไฟล์']);
  if (!(await ask('ตรวจสอบข้อมูลก่อนส่ง', sumHtml(rows)))) return;

  const btn = $('#save'); btn.disabled = true; btn.textContent = 'กำลังส่ง...';
  try {
    const files = await readFiles(fl);
    await api('submit', { module: 'daily', payload, files });
    store.del(dkey(t));
    await notify('บันทึกเรียบร้อย', 'ส่งรายงานเข้าระบบแล้ว', 'ok');
    location.hash = '#list/daily';
  } catch (e) {
    $('#err').textContent = e.message;
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> ตรวจสอบข้อมูลก่อนส่ง';
  }
}

/* ============================================================
   หน้ารายการ + อนุมัติ
   ============================================================ */
function renderList(mod) {
  const m = MODULES[mod];
  if (!has(m.perm)) { $('#app').innerHTML = '<div class="card">ไม่มีสิทธิ์ใช้งานส่วนนี้</div>'; return; }
  const label = name => (m.labels && m.labels[name]) || (m.fields.find(f => f.name === name) || { label: name }).label;
  const isTime = c => /time$|^start$|^end$/.test(c);

  $('#app').className = '';
  $('#app').innerHTML = `${topbar(m.label + ' · รายการ')}
    <div class="card">
      <div class="row">
        <div><label>จากวันที่</label><input type="date" id="from" value="${today().slice(0, 8) + '01'}"></div>
        <div><label>ถึงวันที่</label><input type="date" id="to" value="${today()}"></div>
        <div style="flex:0"><button class="btn" id="refresh" style="width:auto">ค้นหา</button></div>
      </div>
      <div id="tbl" class="tbl-wrap"></div>
      <div class="err" id="err"></div>
    </div>`;
  bindBack();

  const load = async () => {
    $('#err').textContent = '';
    const rows = await api('list', { module: mod, filter: { from: $('#from').value, to: $('#to').value } });
    if (!rows.length) { $('#tbl').innerHTML = '<p>ไม่มีรายการ</p>'; return; }
    const cols = m.cols;
    $('#tbl').innerHTML = `<table><tr>${cols.map(c => `<th>${esc(label(c))}</th>`).join('')}
      <th>หน่วย</th><th>สถานะ</th><th></th></tr>` +
      rows.map(r => `<tr>
        ${cols.map(c => `<td>${esc(isTime(c) ? fmt(r[c]) : r[c])}</td>`).join('')}
        <td>${esc(r.unit)}</td>
        <td><span class="tag ${esc(r.status)}">${r.status === 'approved' ? 'อนุมัติแล้ว' : 'รอตรวจ'}</span></td>
        <td>${has('approve') && r.status === 'pending' ? `<button class="btn ok" data-id="${esc(r.id)}">อนุมัติ</button>` : ''}</td>
      </tr>`).join('') + '</table>';
    document.querySelectorAll('button[data-id]').forEach(btn => {
      btn.onclick = async () => {
        try { await api('approve', { module: mod, id: btn.dataset.id }); load(); }
        catch (e) { $('#err').textContent = e.message; }
      };
    });
  };
  $('#refresh').onclick = () => load().catch(e => $('#err').textContent = e.message);
  load().catch(e => $('#err').textContent = e.message);
}

/* ============================================================
   เริ่มต้นระบบ
   ============================================================ */
(async () => {
  if (session) {
    try { session.user = await api('me'); sessionStorage.setItem('session', JSON.stringify(session)); }
    catch (e) { session = null; sessionStorage.removeItem('session'); }
  }
  render();
})();
</script>
