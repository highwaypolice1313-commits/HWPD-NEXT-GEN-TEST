    ${fileFld('แนบภาพประกอบด่าน (เลือกได้หลายไฟล์)')}`;
  mountForm({
    key: 'checkpoint', topTitle: 'รายงานด่าน จุดตรวจ จุดสกัด', back: 'กลับ', title: '', body, remount: renderCheckpointForm,
    defaults: set => {
      const d = new Date(); set('report_time', localStr(d)); set('start_time', localStr(d)); set('end_time', localStr(new Date(d.getTime() + 3 * 3600e3)));
      if (session.user.unit && OPT.units.includes(session.user.unit)) set('service_unit', session.user.unit);
    },
    // เลือกสถานที่ตั้งด่านแล้วเติมพิกัดให้ (ถ้าในชีต Places มีพิกัด)
    onChange: t => {
      if (t.name !== 'checkpoint_name') return;
      const pl = OPT.places.find(x => x.place === t.value);
      if (pl && pl.lat && pl.lng) { S.set('lat', pl.lat); S.set('lng', pl.lng); }
    },
    submit: () => {
      $('#err').textContent = ''; flushSave();
      const p = collectPayload(), E = makeErrs();
      const req = { service_unit: 'หน่วยบริการ', officer: 'ผู้ปฏิบัติหน้าที่ประจำหน่วย', officer_count: 'จำนวนผู้ปฏิบัติรวม (นาย)', radio_car: 'รถวิทยุตรวจเขต', checkpoint_name: 'สถานที่ตั้งด่าน', start_time: 'เริ่มตั้งด่าน', end_time: 'เลิกด่าน', lat: 'ละติจูด', lng: 'ลองจิจูด' };
      Object.keys(req).forEach(k => {
        const empty = k === 'officer_count' ? !(+p[k] > 0) : !String(p[k] || '').trim();
        if (empty) E.add('กรุณากรอก ' + req[k], k);
      });
      if (p.start_time && p.end_time && p.end_time <= p.start_time) E.add('เวลาเลิกด่านต้องหลังเวลาเริ่มตั้งด่าน', 'end_time');
      const la = parseFloat(p.lat), ln = parseFloat(p.lng);
      if (p.lat && (!isFinite(la) || la < -90 || la > 90)) E.add('ละติจูดไม่ถูกต้อง', 'lat');
      if (p.lng && (!isFinite(ln) || ln < -180 || ln > 180)) E.add('ลองจิจูดไม่ถูกต้อง', 'lng');
      if (E.n) return E.show();
      sendReport('checkpoint', p, rowsFrom(p));
    }
  });
}

      const ta = document.querySelector('#dform [name="evidence_text"]'); if (!ta) return;
      const ev = S.lists.evidence.filter(e => e.item.trim());
      ta.readOnly = ev.length > 0;
      if (ev.length) ta.value = ev.map(e => [e.item, e.qty, e.unit].filter(Boolean).join(' ')).join(', ');
    },
    after: () => { $('#docBtn').onclick = () => soon('เอกสารจับกุม (ม.22-23)'); },   // 🔧 PLACEHOLDER: ต่อกับการสร้างเอกสารจับกุมจริง

      $('#err').textContent = ''; flushSave();
      const p = collectPayload(), E = makeErrs();
      const ch = S.lists.acharges.map(c => (c.charge === 'อื่นๆ' ? (c.other || '').trim() : c.charge)).filter(Boolean);
      if (!p.topic) E.add('กรุณาเลือกหัวข้อการจับกุม', 'topic');
      if (!ch.length) E.add('กรุณาเลือกข้อหาหลัก', '#L-acharges .pkbtn');
      if (!p.event_time) E.add('กรุณาระบุเวลาเกิดเหตุ', 'event_time');
      if ((p.lat && !p.lng) || (!p.lat && p.lng)) E.add('กรุณากรอกพิกัดให้ครบทั้งละติจูดและลองจิจูด', p.lat ? 'lng' : 'lat');
      if (E.n) return E.show();

      const sus = S.lists.suspects.filter(s => s.name.trim());
      const team = S.lists.team.filter(c => c.name.trim()).map(c => c.name);
      const ev = S.lists.evidence.filter(e => e.item.trim());
      const payload = Object.assign({}, p, {
        charges: JSON.stringify(ch), team: JSON.stringify(team), suspects: JSON.stringify(sus), evidence: JSON.stringify(ev),
        // คอลัมน์เดิมของระบบ (ใช้แสดงในหน้ารายการ)
        arrest_time: p.event_time, charge: ch[0], suspect_name: sus.length ? sus[0].name : ''
      });
      const rows = rowsFrom(p);
      rows.splice(1, 0, ['ข้อหา', ch.join(', ')]);
      if (team.length) rows.push(['ชุดจับกุม', team.join(', ')]);
      if (sus.length) rows.push(['ผู้ต้องหา', sus.map(s => s.name).join(', ')]);
      // รูปถ่ายผู้ต้องหา แนบไปพร้อมไฟล์
      const extra = Object.keys(S.photos).sort().map(k => {
        const [si, slot] = k.split(':'), o = S.photos[k];
        return { name: `suspect${+si + 1}_${slot}.jpg`, mime: o.mime, data: o.data };
      });
      sendReport('arrest', payload, rows, extra);
    }
  });
}

// แสดงยอดรวมเปอร์เซ็นต์สาเหตุแบบสด (ต้องได้ 100)
function syncPct() {
  const el = $('#pctSum'); if (!el) return;
  const cs = ['cause_human', 'cause_vehicle', 'cause_road', 'cause_env'].map(k => parseFloat((document.querySelector(`#dform [name="${k}"]`) || {}).value)).filter(isFinite);
  if (!cs.length) { el.textContent = 'กรอกเป็นตัวเลข รวมกันต้องได้ 100'; el.className = 'full sb-sub'; return; }
  const t = cs.reduce((a, b) => a + b, 0), good = Math.round(t) === 100;
  el.textContent = `รวม ${t}% ${good ? '✓ ครบ 100' : '(ต้องได้ 100)'}`; el.className = 'full sb-sub ' + (good ? 'ok' : 'bad');
}

      if (E.n) return E.show();
      sendReport('accident', p, rowsFrom(p));
    }
  });
}

/* ============================================================
   รายการ + รายละเอียด + อนุมัติ + ลบ
   ============================================================ */
const colVal = (k, r) => isTimeKey(k) ? fmt(r[k]) : (r[k] === undefined || r[k] === null ? '' : String(r[k]));
const STT = { pending: 'รอตรวจ', approved: 'อนุมัติแล้ว' };
function recCard(mod, r, i) {
  const m = MODULES[mod], v = m.cols.map(k => colVal(k, r)).filter(Boolean);
  return `<div class="rec" data-i="${i}"><div class="ico ibox sm ${m.tone}"><i class="fa-solid ${m.icon}"></i></div>
    <div class="rec-main"><b>${esc(v[0] || m.label)}</b><span>${esc(v.slice(1).join(' · '))}</span><small>${esc(m.label)} · ${esc(fmt(r.created_at))} · ${esc(r.unit)}</small></div>
    <span class="tag ${esc(r.status)}">${STT[r.status] || esc(r.status)}</span><i class="fa-solid fa-chevron-right chev"></i></div>`;
}
// รายละเอียดรายการเดียว (ทุกฟิลด์ที่มีข้อมูล)
function recordHtml(mod, r) {
  const m = MODULES[mod];
  const lab = k => (m.labels && m.labels[k]) || (m.fields.find(f => f.name === k) || {}).label || LBL[k] || k;
  const skip = ['id', 'files', 'co_officers', 'charges', 'team', 'suspects', 'evidence', 'status', 'created_at', 'created_by', 'unit', '_module'];
  const rows = [];
  Object.keys(r).forEach(k => {
    if (skip.includes(k) || r[k] === '' || r[k] === null || r[k] === undefined) return;
    rows.push([lab(k), isTimeKey(k) ? fmt(r[k]) : /^duty_(from|to)$/.test(k) ? thDisp(String(r[k]).slice(0, 10), false) : r[k]]);
  });
  const arr = k => { try { const a = JSON.parse(r[k] || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } };
  const one = x => typeof x === 'string' ? x : x.charge ? x.charge + (x.n ? ` ×${x.n}` : '') : x.item ? [x.item, x.qty, x.unit].filter(Boolean).join(' ') : x.name ? x.name + (x.role ? ` (${x.role})` : '') + (x.idno ? ` · ${x.idtype || ''} ${x.idno}` : '') + (x.age ? ` · อายุ ${x.age} ปี` : '') : '';
  [['co_officers', 'ผู้ร่วมออก/ผู้ปฏิบัติ'], ['charges', 'รายการข้อหา'], ['team', 'ชุดจับกุม'], ['suspects', 'ผู้ต้องหา'], ['evidence', 'รายการของกลาง']].forEach(([k, l]) => {
    const a = arr(k).map(one).filter(Boolean); if (a.length) rows.push([l, a.join(', ')]);
  });
  const files = String(r.files || '').split('\n').filter(u => /^https:\/\//.test(u));
  let html = sumHtml(rows.concat([['สถานะ', STT[r.status] || r.status], ['บันทึกโดย', `${r.created_by || '-'} (${r.unit || '-'})`], ['เวลาบันทึก', fmt(r.created_at)]]));
  if (files.length) html += `<div class="sum" style="margin-top:6px"><div><span>ไฟล์แนบ</span><b>${files.map((u, i) => `<a href="${esc(u)}" target="_blank" rel="noopener">ไฟล์ ${i + 1}</a>`).join(' · ')}</b></div></div>`;
  return html;
}
async function showRecord(mod, r, onChange) {
  const m = MODULES[mod];
  const canApprove = has('approve') && r.status === 'pending';
  const canDelete = r.status === 'pending' && (r.created_by === session.user.username || has('all'));
  const actions = [{ l: 'ปิด', v: 'x', c: 'ghost' }];
  if (canDelete) actions.unshift({ l: 'ลบรายการ', v: 'del', c: 'danger' });
  if (canApprove) actions.push({ l: 'อนุมัติ', v: 'ok' });
  const v = await modal({ icon: m.icon, tone: 'info', title: m.label, body: recordHtml(mod, r), actions, wide: true });
  try {
    if (v === 'ok') { await api('approve', { module: mod, id: r.id }); toast('อนุมัติรายการแล้ว'); if (onChange) onChange(); }
    if (v === 'del' && await ask('ลบรายการนี้?', '<p>ลบแล้วกู้คืนไม่ได้ (ลบได้เฉพาะรายการที่ยังรอตรวจ)</p>', 'ลบรายการ', 'fa-trash', 'err')) {
      await api('delete', { module: mod, id: r.id }); toast('ลบรายการแล้ว'); if (onChange) onChange();
    }
  } catch (e) { notify('ทำรายการไม่สำเร็จ', e.message, 'err'); }
}

/* ============================================================
   หน้าตั้งค่า (ผู้ดูแลระบบ): ข้อมูลรถวิทยุ และ เจ้าหน้าที่
   ============================================================ */
const ST = { vehicles: { label: 'รถวิทยุ', icon: 'fa-car-side', tone: 't-blue', key: 'car_no', keyLabel: 'เลขรถวิทยุตรวจเขต' },
  officers: { label: 'เจ้าหน้าที่', icon: 'fa-user-shield', tone: 't-green', key: 'name', keyLabel: 'ยศ ชื่อ สกุล' } };
async function renderSettings(tab) {
  if (!has('all')) return denied();
  if (!ST[tab]) tab = 'vehicles';
  $('#app').className = 'narrow';
  $('#app').innerHTML = `${topbar('ตั้งค่า · ผู้ดูแลระบบ')}
    <div class="tabs">${Object.keys(ST).map(k => `<button class="${k === tab ? 'on' : ''}" data-stab="${k}"><i class="fa-solid ${ST[k].icon}"></i> ${ST[k].label}</button>`).join('')}</div>
    <div class="card">
      <div class="st-head"><div><b>${ST[tab].label}ทั้งหมด</b><div class="note-s">แตะรายการเพื่อแก้ไข · ค่าที่บันทึกจะขึ้นในฟอร์มทันที</div></div>
        <button class="btn" id="stAdd" style="width:auto;min-height:44px"><i class="fa-solid fa-plus"></i> เพิ่ม${ST[tab].label}</button></div>
      <input id="stq" placeholder="ค้นหา..." style="margin:14px 0">
      <div id="stList">${skel(3)}</div><div class="err" id="err"></div>
    </div>`;
  bindBack();
  document.querySelectorAll('[data-stab]').forEach(b => { b.onclick = () => { location.hash = '#settings/' + b.dataset.stab; }; });
  let DATA = [];
  const sub = r => tab === 'vehicles'
    ? `พลขับ: ${r.driver || '–'} · พงว.: ${r.radio_op || '–'}`
    : `${r.phone || 'ไม่มีเบอร์'}${r.unit ? ' · ' + r.unit : ''}`;
  const draw = () => {
    const q = ($('#stq').value || '').trim().toLowerCase();
    const rows = DATA.filter(r => !q || Object.values(r).join(' ').toLowerCase().includes(q));
    $('#stList').innerHTML = rows.length ? rows.map((r, i) => `<div class="rec" data-i="${i}">
        <div class="ibox sm ${ST[tab].tone}"><i class="fa-solid ${ST[tab].icon}"></i></div>
        <div class="rec-main"><b>${esc(r[ST[tab].key])}</b><span>${esc(sub(r))}</span></div>
        <i class="fa-solid fa-pen chev"></i></div>`).join('')
      : `<div class="empty-box"><i class="fa-regular fa-folder-open" style="font-size:28px"></i><br>${DATA.length ? 'ไม่พบรายการที่ค้นหา' : 'ยังไม่มีข้อมูล กดปุ่ม "เพิ่ม" เพื่อเริ่ม'}</div>`;
    $('#stList').onclick = e => { const c = e.target.closest('.rec'); if (c) editor(rows[+c.dataset.i]); };
  };
  const load = async () => {
    $('#err').textContent = '';
    try { const d = await api('refs_list'); DATA = d[tab] || []; draw(); }
    catch (e) { $('#stList').innerHTML = ''; $('#err').textContent = e.message; }
  };
  $('#stq').addEventListener('input', draw);
  $('#stAdd').onclick = () => editor(null);

  // หน้าต่างแก้ไข/เพิ่ม (ใช้หน้าต่างล่างบนมือถือ กล่องกลางบนคอม)
  function editor(row) {
    const isNew = !row, r = row || (tab === 'vehicles' ? { car_no: '', driver: '', driver_phone: '', radio_op: '', radio_op_phone: '' } : { name: '', phone: '', unit: '' });
    const names = OPT.officers.map(o => o.name);
    const fieldsHtml = tab === 'vehicles' ? `
      <label>${ST.vehicles.keyLabel} ${rq}</label><input data-k="car_no" value="${esc(r.car_no)}" placeholder="เช่น 5115">
      <label>พลขับ</label><input data-k="driver" value="${esc(r.driver)}" list="stOff" placeholder="พิมพ์หรือเลือกจากรายชื่อ">
      <label>เบอร์โทรพลขับ</label><input data-k="driver_phone" value="${esc(r.driver_phone)}" inputmode="tel">
      <label>พนักงานวิทยุ</label><input data-k="radio_op" value="${esc(r.radio_op)}" list="stOff" placeholder="พิมพ์หรือเลือกจากรายชื่อ">
      <label>เบอร์โทรพนักงานวิทยุ</label><input data-k="radio_op_phone" value="${esc(r.radio_op_phone)}" inputmode="tel">`
      : `<label>${ST.officers.keyLabel} ${rq}</label><input data-k="name" value="${esc(r.name)}" placeholder="เช่น ร.ต.อ. ชื่อ นามสกุล">
      <label>เบอร์โทรศัพท์</label><input data-k="phone" value="${esc(r.phone)}" inputmode="tel" placeholder="08x-xxxxxxx">
      <label>หน่วย</label><input data-k="unit" value="${esc(r.unit)}" list="stUnit" placeholder="เช่น โคกสำโรง">`;
    const ov = sheetShell(`<div class="sh-head"><b>${isNew ? 'เพิ่ม' : 'แก้ไข'}${ST[tab].label}</b><button type="button" class="sh-x" data-x aria-label="ปิด"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="sh-body">${fieldsHtml}
        <datalist id="stOff">${names.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
        <datalist id="stUnit">${OPT.units.map(u => `<option value="${esc(u)}">`).join('')}</datalist>
        <div class="err" id="sterr"></div>
        <div class="cal-act" style="padding:14px 0 0">${isNew ? '' : '<button type="button" class="btn danger" id="stDel">ลบ</button>'}
          <button type="button" class="btn ghost" data-x>ยกเลิก</button><button type="button" class="btn" id="stSave">บันทึก</button></div></div>`);
    const close = () => sheetClose(ov, onKey), onKey = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    const val = () => { const o = {}; ov.querySelectorAll('[data-k]').forEach(i => o[i.dataset.k] = i.value.trim()); return o; };
    ov.addEventListener('click', async e => {
      if (e.target === ov || e.target.closest('[data-x]')) return close();
      if (e.target.closest('#stSave')) {
        const b = e.target.closest('#stSave'), o = val();
        if (!o[ST[tab].key]) { ov.querySelector('#sterr').textContent = 'กรุณากรอก ' + ST[tab].keyLabel; return; }
        busy(b, true, 'กำลังบันทึก...');
        try {
          await api('ref_save', { table: tab, key: isNew ? '' : r[ST[tab].key], row: o });
          close(); await loadOptions(); toast('บันทึกแล้ว'); load();
        } catch (err) { ov.querySelector('#sterr').textContent = err.message; busy(b, false); }
      }
      if (e.target.closest('#stDel')) {
        if (!(await ask('ลบ' + ST[tab].label + '?', `<p>ลบ ${esc(r[ST[tab].key])} ออกจากรายการ (รายงานเดิมไม่หาย)</p>`, 'ลบ', 'fa-trash', 'err'))) return;
        try { await api('ref_delete', { table: tab, key: r[ST[tab].key] }); close(); await loadOptions(); toast('ลบแล้ว'); load(); }
        catch (err) { notify('ลบไม่สำเร็จ', err.message, 'err'); }
      }
    });
    setTimeout(() => { const f = ov.querySelector('input'); if (f && !isTouch()) f.focus(); }, 60);
  }
  load();
}

function renderList(mod) {
  const m = MODULES[mod];
  if (!has(m.perm)) return denied();
  $('#app').className = 'narrow';
  $('#app').innerHTML = `${topbar(m.label + ' · รายการ')}
    <div class="card" id="lcard">
      ${rangeBar()}${rangeFields()}
      <div class="seg" id="stt" style="margin-top:12px"><button data-s="" class="on">ทั้งหมด</button><button data-s="pending">รอตรวจ</button><button data-s="approved">อนุมัติแล้ว</button></div>
      <input id="q" placeholder="ค้นหาในรายการ..." style="margin-top:10px">
      <div id="tbl" style="margin-top:12px"></div><div class="err" id="err"></div>
    </div>`;
  bindBack();
  let ROWS = [], status = '';
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase();
    const rows = ROWS.map((r, i) => ({ r, i })).filter(({ r }) => (!status || r.status === status) && (!q || Object.values(r).join(' ').toLowerCase().includes(q)));
    $('#tbl').innerHTML = rows.length ? rows.map(({ r, i }) => recCard(mod, r, i)).join('')
      : '<div class="empty-box"><i class="fa-regular fa-folder-open" style="font-size:28px"></i><br>ไม่มีรายการ</div>';
  };
  const load = async () => {
    $('#err').textContent = ''; $('#tbl').innerHTML = skel(4);
    try {
      ROWS = (await api('list', { module: mod, filter: { from: getPk('from'), to: getPk('to') } }))
        .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
      draw();
    } catch (e) { $('#tbl').innerHTML = ''; $('#err').textContent = e.message; }
  };
  const card = $('#lcard');
  bindRange(card, load);
  $('#stt').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; status = b.dataset.s; card.querySelectorAll('#stt button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  $('#q').addEventListener('input', draw);
  $('#tbl').addEventListener('click', e => { const c = e.target.closest('.rec'); if (c) showRecord(mod, ROWS[+c.dataset.i], load); });
  refreshPk(); load();
}

/* ============================================================
   เริ่มต้นระบบ
   ============================================================ */
(async () => {
  if (session) {
    try { session.user = await api('me'); sessionStorage.setItem('session', JSON.stringify(session)); }
    catch (e) { session = null; sessionStorage.removeItem('session'); }
  }
  render();
  const before = ENV_OK;
  await probeEnv();
  $('#banner').hidden = ENV !== 'demo';
  if (!session && !before && ENV_OK && ENV === 'demo' && !($('#u') && $('#u').value)) renderLogin();
})();
